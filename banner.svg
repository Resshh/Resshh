<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#2cb67d"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#7f5af0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7f5af0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#2cb67d" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2cb67d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <style>
      .mono { font-family: 'Fira Code', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .line { opacity: 0; animation: show 0.4s ease forwards; }
      .l1 { animation-delay: 0.4s; } .l2 { animation-delay: 0.9s; } .l3 { animation-delay: 1.4s; }
      .l4 { animation-delay: 1.9s; } .l5 { animation-delay: 2.4s; } .l6 { animation-delay: 2.9s; }
      .cursor { animation: blink 1s step-end infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      .fade { opacity: 0; animation: show 1s ease 0.1s forwards; }
      @keyframes show { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes float { 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#0d1117"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="url(#name)" stroke-opacity="0.5" stroke-width="2"/>

  <!-- left: name -->
  <g class="fade">
    <text x="70" y="120" class="mono" font-size="18" fill="#2cb67d">&lt;hello world /&gt;</text>
    <text x="68" y="185" class="sans" font-size="64" font-weight="800" fill="url(#name)">Reshma Thomas</text>
    <text x="70" y="228" class="sans" font-size="22" fill="#c9d1d9">Full Stack Developer · MERN</text>
    <g class="mono" font-size="14" font-weight="600">
      <rect x="70" y="252" width="98" height="28" rx="14" fill="#47a248" fill-opacity="0.15" stroke="#47a248" stroke-opacity="0.6"/>
      <text x="119" y="271" text-anchor="middle" fill="#6cc24a">MongoDB</text>
      <rect x="178" y="252" width="90" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#8b949e" stroke-opacity="0.6"/>
      <text x="223" y="271" text-anchor="middle" fill="#c9d1d9">Express</text>
      <rect x="278" y="252" width="76" height="28" rx="14" fill="#61dafb" fill-opacity="0.12" stroke="#61dafb" stroke-opacity="0.6"/>
      <text x="316" y="271" text-anchor="middle" fill="#61dafb">React</text>
      <rect x="364" y="252" width="84" height="28" rx="14" fill="#68a063" fill-opacity="0.15" stroke="#68a063" stroke-opacity="0.6"/>
      <text x="406" y="271" text-anchor="middle" fill="#8cc84b">Node.js</text>
    </g>
  </g>

  <!-- right: code window -->
  <g class="float">
    <rect x="690" y="50" width="450" height="220" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="714" cy="72" r="6" fill="#ff5f56"/>
    <circle cx="734" cy="72" r="6" fill="#ffbd2e"/>
    <circle cx="754" cy="72" r="6" fill="#27c93f"/>
    <text x="915" y="77" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">reshma.js</text>
    <line x1="690" y1="92" x2="1140" y2="92" stroke="#30363d"/>

    <g class="mono" font-size="15">
      <text x="712" y="124" class="line l1"><tspan fill="#ff7b72">const</tspan><tspan fill="#d2a8ff"> reshma</tspan><tspan fill="#c9d1d9"> = {</tspan></text>
      <text x="732" y="150" class="line l2"><tspan fill="#79c0ff">role</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"Full Stack Developer"</tspan><tspan fill="#c9d1d9">,</tspan></text>
      <text x="732" y="176" class="line l3"><tspan fill="#79c0ff">stack</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#a5d6ff">"M"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"E"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"R"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"N"</tspan><tspan fill="#c9d1d9">],</tspan></text>
      <text x="732" y="202" class="line l4"><tspan fill="#79c0ff">building</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"BEAUTÉ"</tspan><tspan fill="#c9d1d9">,</tspan></text>
      <text x="732" y="228" class="line l5"><tspan fill="#79c0ff">coffee</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#79c0ff">true</tspan></text>
      <text x="712" y="254" class="line l6"><tspan fill="#c9d1d9">};</tspan><tspan class="cursor" fill="#2cb67d"> ▌</tspan></text>
    </g>
  </g>
</svg>
