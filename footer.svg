<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
  <defs>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#2cb67d"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.1" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#7f5af0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7f5af0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#2cb67d" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2cb67d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <style>
      .mono { font-family: 'Fira Code', Consolas, 'Courier New', monospace; }
      .fade { opacity: 0; animation: show 1s ease 0.2s forwards; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes show { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="120" rx="18" fill="#0d1117"/>
  <rect width="1200" height="120" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="120" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="120" rx="18" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="118" rx="18" fill="none" stroke="url(#name)" stroke-opacity="0.5" stroke-width="2"/>

  <g class="fade mono" text-anchor="middle">
    <text x="600" y="58" font-size="26" font-weight="700" fill="url(#name)">Thanks for stopping by!</text>
    <text x="600" y="88" font-size="15" fill="#8b949e"><tspan fill="#ff7b72">return</tspan> <tspan fill="#a5d6ff">"let's build something"</tspan><tspan fill="#c9d1d9">;</tspan><tspan class="cursor" fill="#2cb67d"> ▌</tspan></text>
  </g>
</svg>
